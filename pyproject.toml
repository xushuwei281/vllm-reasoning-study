[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-reasoning-study"
version = "0.1.0"
description = "Budgeted, quality-constrained vLLM serving experiments with a neural surrogate"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.16.3", "scikit-learn==1.6.1", "torch==2.7.1", "httpx==0.28.1", "aiohttp==3.11.18", "matplotlib==3.10.3", "transformers==4.51.3", "huggingface-hub==0.31.2", "PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
report = ["reportlab==4.4.9"]
word = ["python-docx==1.2.0"]

[project.scripts]
vllm-study = "vllm_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
